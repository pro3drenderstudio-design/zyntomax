services:
  postgres:
    image: postgres:16-alpine
    container_name: zyntomax-postgres
    environment:
      POSTGRES_USER: zyntomax
      POSTGRES_PASSWORD: zyntomax_dev
      POSTGRES_DB: zyntomax
    ports:
      - "5433:5432"
    volumes:
      - zyntomax_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: zyntomax-redis
    ports:
      - "6380:6379"

volumes:
  zyntomax_pgdata:
